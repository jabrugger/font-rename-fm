[tool.poetry]
name = "font-rename-neo"
version = "0.4.0"
description = "Preview-first font renaming, exact deduplication, transliteration and optional internal-name cleanup."
authors = ["Jay Soren <futuremotiondev@gmail.com>"]
maintainers = ["jabrugger"]
license = "MIT"
repository = "https://github.com/jabrugger/font-rename-neo"
readme = "README.md"
keywords = ["font", "rename", "typeface", "unpack", "ttf", "otf", "ttc", "otc"]

[tool.poetry.dependencies]
python = "^3.12"
fonttools = "^4.55.3"
faust-cchardet = "^2.1.19"
anyascii = "^0.3.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
font-rename-neo = "font_rename_neo.rename:main"
